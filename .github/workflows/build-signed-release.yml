name: Build signed HanaShop Release APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secrets
        env:
          KS: ${{ secrets.HANASHOP_KEYSTORE_BASE64 }}
          SP: ${{ secrets.HANASHOP_STORE_PASSWORD }}
          KA: ${{ secrets.HANASHOP_KEY_ALIAS }}
          KP: ${{ secrets.HANASHOP_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$SP" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::error::Signing secrets missing: read README-SIGNED-APK-FA.md"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test
        working-directory: qa-tests
        run: |
          cp ../app/src/main/assets/www/app.js ./app.js
          cp ../app/src/main/assets/www/business.js ./business.js
          node reg.js app.js
          node t_ui.js
          node t_pages.js
          node t_notify_backup.js
          node t_business.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Decode signing key
        env:
          KS: ${{ secrets.HANASHOP_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KS" | base64 --decode > "$RUNNER_TEMP/hanashop-upload.jks"
          test -s "$RUNNER_TEMP/hanashop-upload.jks"
      - name: Build and verify
        env:
          HANASHOP_STORE_PASSWORD: ${{ secrets.HANASHOP_STORE_PASSWORD }}
          HANASHOP_KEY_ALIAS: ${{ secrets.HANASHOP_KEY_ALIAS }}
          HANASHOP_KEY_PASSWORD: ${{ secrets.HANASHOP_KEY_PASSWORD }}
        run: |
          export HANASHOP_KEYSTORE_FILE="$RUNNER_TEMP/hanashop-upload.jks"
          gradle --no-daemon assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/hanashop-upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: HanaShop-signed-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14


name: Build HanaShop APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run JavaScript tests
        working-directory: qa-tests
        run: |
          cp ../app/src/main/assets/www/app.js ./app.js
          cp ../app/src/main/assets/www/business.js ./business.js
          cp ../app/src/main/assets/www/management234.js ./management234.js
          cp ../app/src/main/assets/www/phase1.js ./phase1.js
          cp ../app/src/main/assets/www/voice-assistant.js ./voice-assistant.js
          cp ../app/src/main/assets/www/assistant-v2.js ./assistant-v2.js
          cp ../app/src/main/assets/www/customer-actions.js ./customer-actions.js
          cp ../app/src/main/assets/www/invoice-studio.js ./invoice-studio.js
          cp ../app/src/main/assets/www/invoice-premium.js ./invoice-premium.js
          cp ../app/src/main/assets/www/voice-workflows.js ./voice-workflows.js
          node reg.js app.js
          node t_ui.js
          node t_pages.js
          node t_notify_backup.js
          node t_business.js
          node t_management234.js
          node t_phase1.js
          node t_voice.js
          node t_assistant_v2.js
          node t_customer_actions.js
          node t_legacy_customer_ids.js
          node t_invoice_voice_forms.js
          node t_invoice_premium.js
          node t_refunds_finance.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HanaShop-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


      # Isolated trial package so existing shop data survives signature changes.
      - name: Build separate test app
        run: |
          sed -i "s/applicationId 'com.hana.shop'/applicationId 'com.hana.shop.trial.formal2026'/" app/build.gradle
          sed -i 's#android:label="@string/app_name"#android:label="حنا فاکتور شکیل"#' app/src/main/AndroidManifest.xml
          grep -q "applicationId 'com.hana.shop.trial.formal2026'" app/build.gradle
          grep -q 'android:label="حنا فاکتور شکیل"' app/src/main/AndroidManifest.xml
          gradle --no-daemon clean assembleDebug

      - name: Upload isolated test APK
        uses: actions/upload-artifact@v4
        with:
          name: HanaShop-safe-trial-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

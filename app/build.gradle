plugins { id 'com.android.application' }
android {
    namespace 'com.hana.shop'
    compileSdk 34
    defaultConfig { applicationId 'com.hana.shop'; minSdk 26; targetSdk 34; versionCode 2; versionName '1.1' }
    signingConfigs {
        release {
            if (System.getenv('HANASHOP_KEYSTORE_FILE')) {
                storeFile file(System.getenv('HANASHOP_KEYSTORE_FILE'))
                storePassword System.getenv('HANASHOP_STORE_PASSWORD')
                keyAlias System.getenv('HANASHOP_KEY_ALIAS')
                keyPassword System.getenv('HANASHOP_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
    }
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
}
